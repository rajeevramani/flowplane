name: Feature request
description: Propose a new capability or a change to existing behavior.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Maintainers triage each request as accepted, needs-info, deferred, duplicate, or wontfix; an accepted request gets a design before any code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is trying to do what, and where does Flowplane stop them?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What happens today, including any workaround. Commands and error text help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What the user would type or call, and what they would get back.
    validations:
      required: true
  - type: checkboxes
    id: surfaces
    attributes:
      label: Surfaces affected
      options:
        - label: CLI
        - label: REST API / OpenAPI
        - label: MCP tools
        - label: Configuration / environment variables
        - label: Dataplane behavior (Envoy config)
        - label: Dashboard
        - label: Documentation
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes that would let someone say this is done.
    validations:
      required: true
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Design choices you are unsure about.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
