<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flowplane — {{ team }} — MCP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/{{ nonce }}/assets/dashboard.css">
  <script src="/{{ nonce }}/assets/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">flow<span>plane</span> dashboard</div>
    <div class="ctx">
      <span class="chip">team <b>{{ team }}</b></span>
      <span class="chip">read-only</span>
    </div>
    <div class="spacer"></div>
  </header>
  <nav class="tabs">
    <a href="/{{ nonce }}/">Overview</a>
    <a href="/{{ nonce }}/resources">Resources</a>
    <a href="/{{ nonce }}/apis">APIs</a>
    <a href="/{{ nonce }}/learning">Learning</a>
    <a href="/{{ nonce }}/ai">AI</a>
    <a href="/{{ nonce }}/mcp" class="active">MCP</a>
    <a href="/{{ nonce }}/operations">Operations</a>
  </nav>
  <main id="resources">
    <div id="mcp-status"
         hx-get="/{{ nonce }}/partials/mcp/status"
         hx-trigger="load once"
         hx-target="#mcp-status"
         hx-swap="innerHTML">
      <p class="placeholder">Loading…</p>
    </div>
    <div id="mcp-tools"
         hx-get="/{{ nonce }}/partials/mcp/tools"
         hx-trigger="load once"
         hx-target="#mcp-tools"
         hx-swap="innerHTML">
      <p class="placeholder">Loading…</p>
    </div>
    <div id="mcp-agents"
         hx-get="/{{ nonce }}/partials/mcp/agents"
         hx-trigger="load once"
         hx-target="#mcp-agents"
         hx-swap="innerHTML">
      <p class="placeholder">Loading…</p>
    </div>
  </main>
</body>
</html>
