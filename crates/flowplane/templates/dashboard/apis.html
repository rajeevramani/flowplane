<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flowplane — {{ team }} — APIs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/{{ nonce }}/assets/dashboard.css">
  <script src="/{{ nonce }}/assets/htmx.min.js" defer></script>
  <script src="/{{ nonce }}/assets/apis.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">flow<span>plane</span> dashboard</div>
    <div class="ctx">
      <span class="chip">team <b>{{ team }}</b></span>
      <span class="chip">read-only</span>
    </div>
    <div class="spacer"></div>
  </header>
  <nav class="tabs">
    <a href="/{{ nonce }}/">Overview</a>
    <a href="/{{ nonce }}/resources">Resources</a>
    <a href="/{{ nonce }}/apis" class="active">APIs</a>
    <a href="/{{ nonce }}/learning">Learning</a>
    <a href="/{{ nonce }}/ai">AI</a>
    <a href="/{{ nonce }}/mcp">MCP</a>
    <a href="/{{ nonce }}/operations">Operations</a>
  </nav>
  <main id="apis">
    <div aria-live="polite">
    <section id="apis-list"
             hx-get="/{{ nonce }}/partials/apis/list"
             hx-trigger="load once"
             hx-swap="outerHTML">
      <p class="placeholder">Loading API definitions…</p>
    </section>
    </div>
  </main>
</body>
</html>
